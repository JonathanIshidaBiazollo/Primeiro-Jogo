<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meu primeiro jogo</title>
        <link rel="stylesheet" href="style.css">

        
    </head>
    <body>
        <div id="game">

            <div id="gameOver"></div>
            <div id="pontuacao">Pontos: 0</div>
            <div id="vidas">Vidas: ❤️ ❤️ ❤️</div>
            <div id="dificuldade">Nível: 0</div>

            <button id="botaoIniciar">Iniciar Jogo</button>
            <button id="botaoReiniciar">Jogar Novamente</button>

            <div id="player">
                <div class="cockpit"></div>
                <div class="wing left-wing"></div>
                <div class="wing right-wing"></div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
